name: "Pipeline"
on:
  push:
    branches:
      - "main"
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  ci:
    name: "CI"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
        with:
          fetch-depth: 0

      - uses: "moonrepo/setup-toolchain@v0"
        with:
          auto-install: true

      - run: "bun install && bun run build"

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    # Production Pages site deploys only from main; pull requests get a
    # preview deployment on surge.sh instead (see the preview job)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  preview:
    # Per-PR preview at https://katsick-arcgis-atlas-demo-pr-<N>.surge.sh
    # Requires a SURGE_TOKEN repository secret (npx surge login && npx surge token).
    # Skips gracefully when the secret is missing. Fork PRs are excluded
    # (secrets are unavailable there anyway).
    name: "PR Preview"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: "actions/checkout@v5"

      - uses: "moonrepo/setup-toolchain@v0"
        with:
          auto-install: true

      - run: "bun install && bun run build"

      - name: Deploy preview to surge.sh
        id: surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          PREVIEW_DOMAIN: katsick-arcgis-atlas-demo-pr-${{ github.event.number }}.surge.sh
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::notice::SURGE_TOKEN secret not set - skipping PR preview deploy"
            exit 0
          fi
          rm -f dist/*.map
          npx surge ./dist "$PREVIEW_DOMAIN" --token "$SURGE_TOKEN"
          echo "url=https://$PREVIEW_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        if: steps.surge.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.surge.outputs.url }}";
            const marker = "<!-- pr-preview-comment -->";
            const body = [
              marker,
              "### 🔍 PR preview deployed",
              "",
              url,
              "",
              `_Updated for ${context.payload.pull_request.head.sha}_`,
              "",
              "---",
              "_Generated by [Claude Code](https://claude.ai/code)_",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
