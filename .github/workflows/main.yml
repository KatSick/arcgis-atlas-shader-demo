name: "Pipeline"
on:
  push:
    branches:
      - "main"
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  ci:
    name: "CI"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
        with:
          fetch-depth: 0

      - uses: "moonrepo/setup-toolchain@v0"
        with:
          auto-install: true

      - run: "bun install && bun run build"

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    # Deploys the production Pages site on pushes to main and on same-repo
    # pull requests (fork PRs lack the required permissions). A PR deploy
    # replaces the live site until the next deploy from main.
    # NOTE: the github-pages environment must allow the PR branch, otherwise
    # this job is rejected before it starts: Settings -> Environments ->
    # github-pages -> Deployment branches -> add a pattern like claude/* or
    # choose "No restriction".
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
